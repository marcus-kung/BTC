name: Daily portfolio monitor
on:
  schedule:
    - cron: '15 7 * * *'
      timezone: Europe/London
  workflow_dispatch:
  pull_request:
    paths:
      - 'daily_monitor/**'
      - '.github/workflows/portfolio-monitor.yml'
      - 'trading_dashboard/portfolio.py'
permissions:
  contents: read
concurrency:
  group: portfolio-monitor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: daily_monitor/requirements.txt
      - run: pip install -r daily_monitor/requirements.txt
      - run: PYTHONPATH=.:trading_dashboard python -m pytest daily_monitor/tests trading_dashboard/tests -q
  report:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: daily_monitor/requirements.txt
      - run: pip install -r daily_monitor/requirements.txt
      - uses: actions/cache@v4
        with:
          path: .monitor-cache
          key: monitor-${{ runner.os }}-${{ github.run_id }}
          restore-keys: monitor-${{ runner.os }}-
      - run: python -m daily_monitor.run
      - name: Display morning report
        run: cat daily_monitor/output/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morning-report-${{ github.run_id }}
          path: daily_monitor/output/
          retention-days: 90
      - name: Store refreshed CSV and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daily_monitor/output
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh daily portfolio research [skip ci]'
            git push
          fi
